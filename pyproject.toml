[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-agent"
version = "0.2.0"
description = "TRIAGE: Three-level Routing and Intelligent Agent Guidance for Efficient Execution — reduce LLM agent token consumption by reusing historical experience trajectories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TRIAGE Contributors"}
]
keywords = [
    "llm",
    "agent",
    "token-reduction",
    "triage",
    "react",
    "trajectory",
    "experience-reuse",
    "skill",
    "taas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/weiruocan/triage"
Source = "https://github.com/weiruocan/triage"
Tracker = "https://github.com/weiruocan/triage/issues"

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["triage*"]
